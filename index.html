<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Roleta Cassino</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #111, #000);
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: gold;
      text-shadow: 2px 2px 5px #000;
    }
    .screen {
      width: 320px;
      height: 180px;
      margin: 20px auto;
      background: #222;
      border: 4px solid gold;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 0 20px gold;
    }
    .icons {
      font-size: 50px;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      background: crimson;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }
    button:hover {
      background: darkred;
      transform: scale(1.05);
    }
    .saldo {
      margin-top: 20px;
      font-size: 20px;
      color: lightgreen;
    }
  </style>
</head>
<body>
  <h1>🎰 Roleta Cassino 🎰</h1>
  <div class="screen" id="screen">
    <div class="icons" id="icons">🎲</div>
    <div id="resultado">Clique em Girar!</div>
  </div>
  <button onclick="girar()">Girar</button>
  <div class="saldo" id="saldo">Saldo: R$ 100</div>

  <script>
    let saldo = 100;
    let icones = ["🎲", "🎴", "🎰", "♠️", "♥️", "♦️", "♣️"];

    function girar() {
      let resultado = Math.random() < 0.5 ? "Perdeu" : "Ganhou";
      let valor = Math.floor(Math.random() * 50) + 10;

      let sorteioFinal = icones[Math.floor(Math.random() * icones.length)];
      let i = 0;
      let rodadas = 20; // quantas vezes a roleta gira
      let intervalo = setInterval(() => {
        document.getElementById("icons").textContent = icones[i % icones.length];
        i++;
        if (i > rodadas) {
          clearInterval(intervalo);
          document.getElementById("icons").textContent = sorteioFinal;

          if (resultado === "Ganhou") {
            saldo += valor;
            document.getElementById("resultado").textContent = `🎉 Você ganhou R$${valor}!`;
          } else {
            saldo -= valor;
            document.getElementById("resultado").textContent = `💸 Você perdeu R$${valor}!`;
          }

          if (saldo <= 0) {
            document.getElementById("resultado").textContent = "Fim de jogo! Saldo zerado.";
            saldo = 0;
          }

          document.getElementById("saldo").textContent = `Saldo: R$ ${saldo}`;
        }
      }, 100); // velocidade da roleta
    }
  </script>
</body>
</html>
