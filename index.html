<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Roleta Cassino</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #111, #000);
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: gold;
      text-shadow: 2px 2px 5px #000;
    }
    .roleta {
      display: flex;
      justify-content: center;
      margin: 20px auto;
      width: 360px;
      border: 4px solid gold;
      border-radius: 10px;
      background: #222;
      box-shadow: 0 0 20px gold;
      overflow: hidden;
    }
    .slot {
      width: 100px;
      height: 100px;
      font-size: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px;
      background: #333;
      border-radius: 8px;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      background: crimson;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }
    button:hover {
      background: darkred;
      transform: scale(1.05);
    }
    .saldo {
      margin-top: 20px;
      font-size: 20px;
      color: lightgreen;
    }
    #resultado {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎰 Roleta Cassino 🎰</h1>
  <div class="roleta">
    <div class="slot" id="slot1">🎲</div>
    <div class="slot" id="slot2">🎴</div>
    <div class="slot" id="slot3">🎰</div>
  </div>
  <button onclick="girar()">Girar</button>
  <div class="saldo" id="saldo">Saldo: R$ 100</div>
  <div id="resultado">Clique em Girar!</div>

  <script>
    let saldo = 100;
    let icones = ["🎲","🎴","🎰","♠️","♥️","♦️","♣️","🍒","🔔","⭐"];

    function girar() {
      let rodadas = 20; // quantas vezes gira
      let i = 0;
      let intervalo = setInterval(() => {
        document.getElementById("slot1").textContent = icones[Math.floor(Math.random()*icones.length)];
        document.getElementById("slot2").textContent = icones[Math.floor(Math.random()*icones.length)];
        document.getElementById("slot3").textContent = icones[Math.floor(Math.random()*icones.length)];
        i++;
        if (i > rodadas) {
          clearInterval(intervalo);
          verificarResultado();
        }
      }, 100); // velocidade da roleta
    }

    function verificarResultado() {
      let s1 = document.getElementById("slot1").textContent;
      let s2 = document.getElementById("slot2").textContent;
      let s3 = document.getElementById("slot3").textContent;

      if (s1 === s2 && s2 === s3) {
        let ganho = Math.floor(Math.random()*50)+20;
        saldo += ganho;
        document.getElementById("resultado").textContent = `🎉 JACKPOT! Você ganhou R$${ganho}!`;
      } else {
        let perda = Math.floor(Math.random()*30)+10;
        saldo -= perda;
        document.getElementById("resultado").textContent = `💸 Você perdeu R$${perda}!`;
      }

      if (saldo <= 0) {
        saldo = 0;
        document.getElementById("resultado").textContent = "Fim de jogo! Saldo zerado.";
      }

      document.getElementById("saldo").textContent = `Saldo: R$ ${saldo}`;
    }
  </script>
</body>
</html>
